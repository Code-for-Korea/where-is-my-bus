ko:
  layout:
    title: "내 버스는 언제 올까?"

  # rails-i18n 없이 쓰는 최소 한국어 검증 메시지. 형식은 "속성명: 메시지".
  errors:
    format: "%{attribute}: %{message}"
    messages:
      blank: "입력해 주세요"
      present: "비워 두어야 합니다"
      required: "선택해 주세요"
      taken: "이미 사용 중입니다"
      invalid: "올바르지 않습니다"
      inclusion: "허용되지 않는 값입니다"
      not_a_number: "숫자여야 합니다"
      not_an_integer: "정수여야 합니다"
      greater_than: "%{count}보다 커야 합니다"
      greater_than_or_equal_to: "%{count} 이상이어야 합니다"
      less_than: "%{count}보다 작아야 합니다"
      less_than_or_equal_to: "%{count} 이하여야 합니다"
      too_short: "%{count}자 이상이어야 합니다"
      too_long: "%{count}자 이하여야 합니다"
      confirmation: "%{attribute}와 일치하지 않습니다"

  activerecord:
    errors:
      messages:
        required: "선택해 주세요"
        restrict_dependent_destroy:
          has_many: "%{record}이(가) 남아 있습니다"
    attributes:
      route:
        name: "노선명"
        trips: "운행 기록"
      stop:
        name: "정류장명"
        lat: "위도"
        lng: "경도"
        stop_visits: "방문 기록"
      route_stop:
        sequence: "정차 순서"
        stop: "정류장"
        stop_id: "정류장"
        route: "노선"
      bus:
        license_plate: "번호판"
        bus_number: "버스 번호"
        pin: "PIN"
        trips: "운행 기록"
        base: "차량"
      trip:
        bus: "차량"
        route: "노선"
        started_at: "운행 시작 시각"
      user:
        email_address: "이메일"
        password: "비밀번호"
        password_confirmation: "비밀번호 확인"
